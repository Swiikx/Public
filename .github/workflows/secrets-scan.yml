name: "Controle de secrets"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: "Secrets et fichiers interdits"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Le meme script que le hook pre-commit, en mode --all : il controle
      # tous les fichiers suivis et pas seulement les lignes ajoutees.
      #
      # Le controle de fuite (noms d'hotes, employeur) ne tourne PAS ici : sa
      # liste est volontairement hors du depot, donc indisponible en CI. Ce
      # filet-la reste local, c'est le prix de ne pas versionner la liste.
      - name: "Scanner les fichiers suivis"
        run: python3 .githooks/check-secrets.py --all
