# Template CI Docker : build de l'image + scan de vulnérabilités.
#
# Copier vers .github/workflows/<projet>-docker.yml puis remplacer
# CHEMIN/DU/PROJET par le chemin réel (ex. projects/mon-projet).
# Sans le filtre paths, ce workflow tourne à chaque commit du dépôt.
#
# Ce template ne pousse rien sur un registre : il construit et scanne.
# Pour publier, ajouter docker/login-action + push: true, avec les
# credentials du registre en secrets GitHub.

name: "Docker CI — CHEMIN/DU/PROJET"

on:
  push:
    branches: [main]
    paths:
      - 'CHEMIN/DU/PROJET/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CHEMIN/DU/PROJET/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-scan:
    name: "Build & scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: "Build (chargée en local, pas poussée)"
        uses: docker/build-push-action@v6
        with:
          context: CHEMIN/DU/PROJET
          file: CHEMIN/DU/PROJET/Dockerfile
          push: false
          load: true
          tags: mon-projet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Hadolint — Dockerfile"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: CHEMIN/DU/PROJET/Dockerfile
          failure-threshold: warning

      - name: "Trivy — scan de l'image"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mon-projet:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # exit-code: '1' pour faire échouer le job sur une CRITICAL/HIGH,
          # une fois que l'image est propre.
          exit-code: '0'

      - name: "Upload SARIF"
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: "Smoke test compose"
        working-directory: CHEMIN/DU/PROJET
        run: |
          cp .env.example .env
          docker compose config
