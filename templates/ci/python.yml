# Template CI Python.
#
# Copier vers .github/workflows/<projet>-python.yml puis remplacer
# CHEMIN/DU/PROJET par le chemin réel (ex. projects/mon-projet).
# Sans le filtre paths, ce workflow tourne à chaque commit du dépôt.

name: "Python CI — CHEMIN/DU/PROJET"

on:
  push:
    branches: [main]
    paths:
      - 'CHEMIN/DU/PROJET/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CHEMIN/DU/PROJET/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: CHEMIN/DU/PROJET

jobs:
  test:
    name: "Lint & tests (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: CHEMIN/DU/PROJET/pyproject.toml

      - name: "Install"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: "Ruff — lint"
        run: ruff check --output-format=github .

      - name: "Ruff — format"
        run: ruff format --check .

      - name: "Pytest"
        run: pytest -q
