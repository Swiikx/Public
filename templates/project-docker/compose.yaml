services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mon-projet:dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    # Durcissement par défaut : système de fichiers en lecture seule,
    # pas d'escalade de privilèges, tmpfs pour les fichiers temporaires.
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 3s
      retries: 3
