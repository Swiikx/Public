[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mon-projet"
version = "0.1.0"
description = "<Description courte du projet.>"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
mon-projet = "mon_projet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mon_projet"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplifications
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
